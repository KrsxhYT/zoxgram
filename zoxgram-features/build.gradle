plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zoxgram.features'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Match all custom variants used by TMessagesProj so dependency resolution succeeds
        standalone { matchingFallbacks = ['release'] }
        HA_private { matchingFallbacks = ['release'] }
        HA_public { matchingFallbacks = ['release'] }
        HA_hardcore { matchingFallbacks = ['release'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}
