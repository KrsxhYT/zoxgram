name: Restore and patch Zoxgram files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix ApplicationLoader and theme
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          AL="TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java"
          SIZE=$(wc -c < "$AL" || echo 0)
          echo "AppLoader size=$SIZE"
          if [ "$SIZE" -lt 5000 ]; then
            curl -sL -H "Accept: application/vnd.github.raw+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/KrsxhYT/zoxgram/git/blobs/5405be7f611ac6ce7c4b36937043e99ffeb7914e" \
              -o "$AL"
            echo "Restored ApplicationLoader"
          fi
          python3 -c "
          from pathlib import Path
          p = Path('TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java')
          c = p.read_text(encoding='utf-8', errors='replace')
          assert 'class ApplicationLoader' in c
          if 'ZoxgramThemeHelper' not in c:
              old = '        SharedConfig.loadConfig();\n        SharedPrefsHelper.init(applicationContext);'
              new = old + '''\n        // Nicegram-style: force Zoxgram Red theme\n        try {\n            AndroidUtilities.runOnUIThread(ZoxgramThemeHelper::forceApplyRedThemeIfNeeded);\n        } catch (Throwable ignore) {\n            try {\n                ZoxgramThemeHelper.forceApplyRedThemeIfNeeded();\n            } catch (Throwable ignored) {}\n        }'''
              if old not in c:
                  raise SystemExit('inject point missing')
              p.write_text(c.replace(old, new, 1), encoding='utf-8')
              print('injected')
          else:
              print('already injected')
          "
          DA="TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java"
          DSIZE=$(wc -c < "$DA" || echo 0)
          if [ "$DSIZE" -lt 10000 ]; then
            curl -sL -H "Accept: application/vnd.github.raw+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/KrsxhYT/zoxgram/git/blobs/3369eb23273ce99bb8e18d8c38ffac78438d0e5d" \
              -o "$DA"
            echo "Restored DialogsActivity"
          fi

      - name: Commit
        run: |
          git config user.name zoxgram-bot
          git config user.email bot@zoxgram.local
          git add -A
          git commit -m "Restore ApplicationLoader + force Zoxgram Red theme" || true
          git push
