
name: Build Zoxgram APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: zoxgram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::Missing RELEASE_KEYSTORE_BASE64"
            exit 1
          }
          test -n "$STORE_PASSWORD" || {
            echo "::error::Missing RELEASE_STORE_PASSWORD"
            exit 1
          }
          test -n "$KEY_PASSWORD" || {
            echo "::error::Missing RELEASE_KEY_PASSWORD"
            exit 1
          }
          test -n "$KEY_ALIAS" || {
            echo "::error::Missing RELEASE_KEY_ALIAS"
            exit 1
          }

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p TMessagesProj/config
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > TMessagesProj/config/release.keystore

          test -s TMessagesProj/config/release.keystore

      - name: Prepare Gradle signing properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          {
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Verify keystore
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore TMessagesProj/config/release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew \
            :TMessagesProj_App:assembleAfatRelease \
            --no-daemon \
            --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zoxgram-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
