
name: Build Zoxgram APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: zoxgram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools directory not found: $SDK/cmdline-tools"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager in $SDK/cmdline-tools"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Using Android SDK: $SDK"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses

      - name: Install required Android SDK packages
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_PASSWORD$KEY_ALIAS" ]; then
            echo "Release signing secrets are not configured; using the repository's CI keystore."
            exit 0
          fi

          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && \
            test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
              echo "::error::Configure all four RELEASE_* signing secrets, or remove them to use the CI keystore."
              exit 1
            }

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > TMessagesProj/config/release.keystore

          {
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed APK
        run: |
          set -o pipefail
          ./gradlew \
            :TMessagesProj_App:assembleAfatRelease \
            --no-daemon \
            --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          {
            grep -E "\.java:[0-9]+: error" build.log
            grep -E "What went wrong|Execution failed|AAPT: error|error: " build.log
          } | awk '!seen[$0]++' | head -10 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zoxgram-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
