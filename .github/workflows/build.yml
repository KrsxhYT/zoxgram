
name: Build Zoxgram APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: zoxgram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_PASSWORD$KEY_ALIAS" ]; then
            echo "Release signing secrets are not configured; using the repository's CI keystore."
            exit 0
          fi

          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && \
            test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
              echo "::error::Configure all four RELEASE_* signing secrets, or remove them to use the CI keystore."
              exit 1
            }

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > TMessagesProj/config/release.keystore

          {
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed APK
        run: |
          ./gradlew \
            :TMessagesProj_App:assembleAfatRelease \
            --no-daemon \
            --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zoxgram-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
