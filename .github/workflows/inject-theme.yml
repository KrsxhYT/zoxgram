name: Inject theme force

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java")
          c = p.read_text(encoding="utf-8")
          if "ZoxgramThemeHelper" in c:
              print("already done")
          else:
              marker = "SharedPrefsHelper.init(applicationContext);"
              idx = c.find(marker)
              if idx < 0:
                  raise SystemExit("marker not found")
              insert = marker + """
        // Nicegram-style: force Zoxgram Red theme
        try {
            AndroidUtilities.runOnUIThread(ZoxgramThemeHelper::forceApplyRedThemeIfNeeded);
        } catch (Throwable ignore) {
            try {
                ZoxgramThemeHelper.forceApplyRedThemeIfNeeded();
            } catch (Throwable ignored) {}
        }"""
              c = c[:idx] + insert + c[idx+len(marker):]
              p.write_text(c, encoding="utf-8")
              print("injected ok", len(c))
          PY
          git config user.name zoxgram-bot
          git config user.email bot@zoxgram.local
          git add -A
          git commit -m "Inject ZoxgramThemeHelper force apply into ApplicationLoader" || true
          git push
