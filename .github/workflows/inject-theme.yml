name: Inject theme force

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject theme helper call
        run: |
          echo  | base64 -d > /tmp/inject.py
          python3 /tmp/inject.py
          git config user.name zoxgram-bot
          git config user.email bot@zoxgram.local
          git add -A
          git commit -m "Inject ZoxgramThemeHelper into ApplicationLoader" || true
          git push
