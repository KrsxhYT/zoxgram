name: Inject theme force

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject theme helper call
        run: |
          python3 -c "
          import pathlib
          p = pathlib.Path('TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java')
          c = p.read_text(encoding='utf-8')
          if 'ZoxgramThemeHelper' in c:
              print('already')
          else:
              m = 'SharedPrefsHelper.init(applicationContext);'
              i = c.find(m)
              assert i >= 0
              extra = '''
        // Nicegram-style force Zoxgram Red theme
        try {
            AndroidUtilities.runOnUIThread(ZoxgramThemeHelper::forceApplyRedThemeIfNeeded);
        } catch (Throwable ignore) {
            try {
                ZoxgramThemeHelper.forceApplyRedThemeIfNeeded();
            } catch (Throwable ignored) {}
        }'''
              p.write_text(c[:i] + m + extra + c[i+len(m):], encoding='utf-8')
              print('injected')
          "
          git config user.name zoxgram-bot
          git config user.email bot@zoxgram.local
          git add -A
          git commit -m "Inject ZoxgramThemeHelper into ApplicationLoader" || true
          git push
