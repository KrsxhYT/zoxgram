name: Inject theme force

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject theme helper call
        run: |
          FILE=TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java
          if grep -q ZoxgramThemeHelper "$FILE"; then
            echo already
          else
            python3 -c "import pathlib;p=pathlib.Path('$FILE');c=p.read_text();m='SharedPrefsHelper.init(applicationContext);';i=c.find(m);assert i>=0;ins=m+chr(10)+'        // Nicegram-style force Zoxgram Red'+chr(10)+'        try { AndroidUtilities.runOnUIThread(ZoxgramThemeHelper::forceApplyRedThemeIfNeeded); } catch (Throwable e1) { try { ZoxgramThemeHelper.forceApplyRedThemeIfNeeded(); } catch (Throwable e2) {} }';p.write_text(c[:i]+ins+c[i+len(m):]);print('ok',len(c))"
          fi
          git config user.name zoxgram-bot
          git config user.email bot@zoxgram.local
          git add -A
          git commit -m "Inject ZoxgramThemeHelper into ApplicationLoader" || true
          git push
