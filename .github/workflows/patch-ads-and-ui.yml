name: Patch ads hook
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-ads-and-ui.yml'
      - 'zoxgram-features/src/main/java/com/zoxgram/features/ZoxgramAds.java'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Insert Disable Ads early return
        run: |
          set -euo pipefail
          FILE="TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java"
          if grep -q 'Zoxgram: Disable Ads' "$FILE"; then
            echo already_patched
            exit 0
          fi
          python3 -c "
          from pathlib import Path
          p = Path('$FILE')
          lines = p.read_text().splitlines(True)
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              out.append(line)
              if 'public SponsoredMessagesInfo getSponsoredMessages(long dialogId)' in line:
                  # next line should be opening brace already on same or next
                  if '{' in line:
                      out.append('        // Zoxgram: Disable Ads\n')
                      out.append('        try {\n')
                      out.append('            if (com.zoxgram.features.ZoxgramAds.shouldBlockSponsored(ApplicationLoader.applicationContext)) {\n')
                      out.append('                return null;\n')
                      out.append('            }\n')
                      out.append('        } catch (Throwable ignore) {}\n')
                  elif i+1 < len(lines) and '{' in lines[i+1]:
                      out.append(lines[i+1])
                      i += 1
                      out.append('        // Zoxgram: Disable Ads\n')
                      out.append('        try {\n')
                      out.append('            if (com.zoxgram.features.ZoxgramAds.shouldBlockSponsored(ApplicationLoader.applicationContext)) {\n')
                      out.append('                return null;\n')
                      out.append('            }\n')
                      out.append('        } catch (Throwable ignore) {}\n')
              i += 1
          p.write_text(''.join(out))
          print('done', p.stat().st_size)
          "
          grep -n 'Zoxgram: Disable Ads' "$FILE" | head -3
      - name: Commit
        run: |
          git config user.name zoxgram-bot
          git config user.email bot@zoxgram.local
          git add -A
          git status
          git commit -m "Hook Disable Ads into getSponsoredMessages" || exit 0
          git push
